<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f9fafb;color:#111827;line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:680px;margin:0 auto;padding:2rem 1rem}
.text-center{text-align:center}
h1{font-size:1.5rem;font-weight:700;color:#111827}
h2{font-size:1.125rem;font-weight:700;color:#111827;margin-bottom:1rem}
.subtitle{font-size:.875rem;color:#6b7280;margin-top:.25rem}
.basis{font-size:.75rem;color:#9ca3af;margin-top:.125rem}

/* Steps indicator */
.steps{display:flex;align-items:center;justify-content:center;gap:4px;margin:2rem 0;flex-wrap:wrap}
.step-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9999px;font-size:.75rem;font-weight:500;border:none;cursor:default;transition:all .2s}
.step-btn.active{background:#2563eb;color:#fff}
.step-btn.done{background:#dbeafe;color:#1d4ed8;cursor:pointer}
.step-btn.done:hover{background:#bfdbfe}
.step-btn.pending{background:#f3f4f6;color:#9ca3af;cursor:pointer}
.step-btn.pending:hover{background:#e5e7eb;color:#4b5563}
.preview-banner{background:#fff8e1;border:1px solid #ffa000;border-left-width:4px;border-radius:.5rem;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.8125rem;color:#7c4a00;line-height:1.5}
.preview-banner strong{display:block;margin-bottom:2px}
.ahead{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;margin-bottom:1.5rem;overflow:hidden}
.ahead-toggle{width:100%;background:none;border:none;padding:.8rem 1.25rem;font-size:.8125rem;font-weight:600;color:#1d4ed8;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:inherit}
.ahead-toggle:hover{background:#f9fafb}
.ahead-body{padding:.25rem 1.25rem 1rem;border-top:1px solid #f3f4f6}
.ahead-lead{font-size:.8125rem;color:#4b5563;margin:.6rem 0 .5rem}
.ahead-item{display:flex;gap:.7rem;padding:.55rem 0;border-bottom:1px solid #f9fafb;font-size:.8125rem;text-align:left}
.ahead-item:last-child{border-bottom:none}
.ahead-n{flex:0 0 22px;height:22px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600}
.ahead-t{font-weight:600;color:#111827}
.ahead-d{color:#6b7280;margin-top:1px;line-height:1.45}
.step-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.step-btn.active .step-num{background:rgba(255,255,255,.2)}
.step-sep{width:16px;height:1px;margin:0 2px}
.step-sep.done{background:#93c5fd}
.step-sep.pending{background:#e5e7eb}

/* Card */
.card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}

/* Form elements */
label{display:block;font-size:.875rem;font-weight:500;color:#374151;margin-bottom:.25rem}
input[type="text"],input[type="number"],input[type="date"],select{width:100%;padding:.5rem .75rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.875rem;font-family:inherit;color:#111827;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.3)}
/* Hide number input spinner arrows */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
.input-center{text-align:center}
.field{margin-bottom:1rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.hint{font-size:.75rem;color:#6b7280;margin-top:.5rem}
.desc{font-size:.875rem;color:#4b5563;margin-bottom:1rem}

/* Table */
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{background:#f3f4f6;padding:.75rem 1rem;text-align:center;font-weight:500;color:#374151}
th:first-child{text-align:left}
td{padding:.75rem 1rem;border-top:1px solid #f3f4f6}
td:first-child{font-weight:500;color:#374151}
.tbl-wrap{border:1px solid #e5e7eb;border-radius:.75rem;overflow:hidden;margin-bottom:1rem}

/* Metric cards */
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem}
.metric-box{border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem}
.metric-label{font-size:.75rem;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.05em}
.metric-val{font-size:1.875rem;font-family:'DM Sans',monospace;font-weight:700}
.metric-sub{font-size:.875rem;font-weight:500}
.metric-box.sev{border-width:2px}

/* Info box */
.info{background:#f9fafb;border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem;font-size:.875rem;color:#374151;margin-bottom:1.25rem}
.info .info-title{font-weight:500;margin-bottom:.25rem}

/* Test result cards */
.test-card{border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.test-card.disabled{border-color:#f3f4f6;opacity:.6}
.test-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem}
.test-name{font-weight:500;color:#1f2937}
.badge{padding:4px 12px;border-radius:9999px;font-size:.75rem;font-weight:500}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-green{background:#d1fae5;color:#065f46}
.badge-gray{background:#f3f4f6;color:#6b7280}
.test-note{font-size:.75rem;color:#6b7280}
.test-stat{font-size:.75rem;color:#4b5563;font-family:monospace;margin-top:.25rem}

/* Context buttons */
.ctx-group{margin-bottom:1.25rem}
.ctx-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.ctx-btn{padding:.75rem;border-radius:.5rem;font-size:.75rem;text-align:left;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.4}
.ctx-btn:hover{border-color:#9ca3af}
.ctx-btn.selected{border-color:#3b82f6;background:#eff6ff;color:#1e40af;box-shadow:0 0 0 1px #93c5fd}

/* Classification */
.class-box{border-width:2px;border-style:solid;border-radius:1rem;padding:1.5rem;text-align:center;margin-bottom:1.25rem}
.class-label{font-size:.875rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.class-val{font-size:3rem;font-weight:700}
.breakdown{border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem;font-size:.875rem;margin-bottom:1.25rem}
.breakdown-title{font-weight:500;color:#1f2937;margin-bottom:.75rem}
.bk-row{display:flex;justify-content:space-between;margin-bottom:.25rem;color:#374151}
.bk-row span:last-child{font-weight:500}
.bk-divider{border-top:1px solid #e5e7eb;padding-top:.5rem;margin-top:.5rem}

/* Report */
.report{border:1px solid #e5e7eb;border-radius:.75rem;padding:1.25rem;font-size:.875rem;background:#fff;margin-bottom:1rem}
.report-header{text-align:center;border-bottom:1px solid #e5e7eb;padding-bottom:1rem;margin-bottom:1rem}
.report-title{font-size:1.125rem;font-weight:700;color:#111827}
.report-org{font-size:.875rem;color:#4b5563}
.report-date{font-size:.75rem;color:#9ca3af}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:1rem}
.report-grid span:first-child{color:#6b7280}
.report-grid .val{font-weight:500}
.report-section{border-top:1px solid #e5e7eb;padding-top:.75rem;margin-top:.75rem}
.report-section-title{font-size:.75rem;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.stat-box{background:#f9fafb;border-radius:.375rem;padding:.5rem;font-size:.75rem}
.stat-box .stat-name{font-weight:500}
.stat-box .stat-val{font-family:monospace}
.report-final{display:flex;align-items:center;gap:.75rem}
.report-final-label{font-size:.75rem;color:#6b7280}
.report-final-badge{padding:.5rem 1rem;border-radius:.5rem;font-weight:700;font-size:1.125rem;border-width:2px;border-style:solid}
.report-methodology{font-size:.75rem;color:#6b7280;line-height:1.5}
.report-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:.5rem}
.report-metrics div span:first-child{display:block;font-size:.75rem;color:#6b7280}
.report-metrics .big{font-family:monospace;font-weight:700;font-size:1.125rem}

/* Buttons */
.btn-row{display:flex;justify-content:space-between}
.btn{padding:.625rem 1.25rem;border-radius:.5rem;font-size:.875rem;font-weight:500;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-primary:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}
.btn-secondary{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-secondary:hover{background:#f9fafb}
.btn-secondary:disabled{color:#d1d5db;cursor:not-allowed;border-color:#e5e7eb}
.btn-dark{background:#1f2937;color:#fff}.btn-dark:hover{background:#374151}
.btn-group{display:flex;gap:.75rem}

/* Threshold dots */
.thresh-table{width:100%;font-size:.875rem;margin-top:.25rem}
.thresh-table th{font-size:.75rem;color:#6b7280;font-weight:400;padding:.25rem}
.thresh-table td{padding:.25rem;text-align:center}
.thresh-table td:first-child{text-align:left;color:#374151}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%}
.dot.active{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
.dot.dim{opacity:.3}

/* Footer */
.footer{margin-top:2rem;text-align:center;font-size:.75rem;color:#9ca3af;line-height:1.8}
.footer a{color:#3b82f6;text-decoration:underline}
.footer a:hover{color:#2563eb}

/* Print */
@media print{*,*::before,*::after{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}body{background:#fff}.container{max-width:100%}.steps,.btn-row,.btn-group,.footer,.ahead,.preview-banner{display:none!important}.card{box-shadow:none;border:1px solid #ccc}}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}.metric-row{grid-template-columns:1fr}.ctx-opts{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr}.report-grid{grid-template-columns:1fr}.report-metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="text-center" style="margin-bottom:2rem">
    <h1>AI Bias Testing Tool</h1>
    <div class="subtitle">Disparate impact analysis for AI systems</div>
    <div class="basis">Based on NIST AI RMF 1.0, EEOC Uniform Guidelines (29 CFR 1607.4), and NIST SP 1270</div>
  </div>
  <div class="steps" id="steps-bar"></div>
  <div class="ahead" id="ahead"></div>
  <div class="card" id="step-content"></div>
  <div class="btn-row" id="nav-buttons"></div>
  <div class="footer">
     <p>Methodology: NIST AI RMF 1.0, NIST SP 1270, EEOC Uniform Guidelines (29 CFR 1607.4), EEOC Technical Assistance on AI and Title VII.</p>
  </div>
</div>

<script>
const STEPS=["System Info","Group Data","Metrics","Statistics","Context","Classification","Report"];
const STEP_INFO=[
 ["System Info","The system name, owner, register ID, test date, and whether this is pre-deployment, recurring, or incident-triggered."],
 ["Group Data","The two groups you are comparing, defined by protected class, and the favourable and unfavourable outcome counts for each. Gather these before you start."],
 ["Metrics","Calculated for you. Selection rates per group and the disparate impact ratio against the four-fifths rule."],
 ["Statistics","Calculated for you. Fisher's Exact, chi-square, and two-proportion z-test are all run, and the strongest applicable result is used."],
 ["Context","Four questions about the decision: its type, who it affects, how many decisions per year, and how reversible it is."],
 ["Classification","The final bias classification, combining the metrics, the statistics, and the context answers."],
 ["Report","A printable record for your AI inventory and governance review."]];
let aheadOpen=false;
const NEUTRAL={bg:"#f9fafb",text:"#6b7280",border:"#d1d5db"};
const SEV={None:{bg:"#e8f5e9",text:"#1b5e20",border:"#4caf50"},Low:{bg:"#fff8e1",text:"#e65100",border:"#ffa000"},Moderate:{bg:"#fff3e0",text:"#bf360c",border:"#e65100"},Critical:{bg:"#ffebee",text:"#b71c1c",border:"#c62828"}};

let state={step:0,agencyName:"",sysName:"",regId:"",owner:"",testDate:new Date().toISOString().slice(0,10),testType:"Pre-Deployment",groupAName:"Group A",groupBName:"Group B",groupAPos:"",groupANeg:"",groupBPos:"",groupBNeg:"",context:{decisionType:0,affectedPop:0,scale:0,reversibility:0}};

function val(id){const el=document.getElementById(id);return el?el.value:null;}
function sync(){
  const ag=val("f-agency");if(ag!==null)state.agencyName=ag;
  const sn=val("f-sysname");if(sn!==null)state.sysName=sn;
  const ri=val("f-regid");if(ri!==null)state.regId=ri;
  const ow=val("f-owner");if(ow!==null)state.owner=ow;
  const td=val("f-date");if(td!==null)state.testDate=td;
  const tt=val("f-type");if(tt!==null)state.testType=tt;
  const ga=val("f-ga");if(ga!==null)state.groupAName=ga||"Group A";
  const gb=val("f-gb");if(gb!==null)state.groupBName=gb||"Group B";
  const ap=val("f-ap");if(ap!==null)state.groupAPos=ap;
  const an=val("f-an");if(an!==null)state.groupANeg=an;
  const bp=val("f-bp");if(bp!==null)state.groupBPos=bp;
  const bn=val("f-bn");if(bn!==null)state.groupBNeg=bn;
}

function nums(){const a=parseInt(state.groupAPos)||0,b=parseInt(state.groupANeg)||0,c=parseInt(state.groupBPos)||0,d=parseInt(state.groupBNeg)||0;return{a,b,c,d,n1:a+b,n2:c+d};}
function rates(){const{a,b,c,d,n1,n2}=nums();return{rateA:n1>0?a/n1:0,rateB:n2>0?c/n2:0,n1,n2,a,b,c,d};}
function calcDI(){const{rateA,rateB}=rates();if(rateA===0&&rateB===0)return 0;return rateB>0?(rateA<rateB?rateA/rateB:rateB/rateA):0;}
function classifyDI(r){if(r>=.9)return"None";if(r>=.8)return"Low";if(r>=.65)return"Moderate";return"Critical";}

function logFact(n){let r=0;for(let i=2;i<=n;i++)r+=Math.log(i);return r;}
function fisherExact(a,b,c,d){const n=a+b+c+d;const ld=logFact(a+b)+logFact(c+d)+logFact(a+c)+logFact(b+d)-logFact(n);const pc=ld-(logFact(a)+logFact(b)+logFact(c)+logFact(d));let p=0;const mx=Math.min(a+b,a+c);for(let i=0;i<=mx;i++){const j=(a+b)-i,k=(a+c)-i,l=(c+d)-k;if(j<0||k<0||l<0)continue;const lp=ld-(logFact(i)+logFact(j)+logFact(k)+logFact(l));if(lp<=pc+1e-10)p+=Math.exp(lp);}return Math.min(p,1);}
function erf(x){const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+p*x);return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x));}
function chi2(a,b,c,d){const n=a+b+c+d;const e1=((a+b)*(a+c))/n,e2=((a+b)*(b+d))/n,e3=((c+d)*(a+c))/n,e4=((c+d)*(b+d))/n;if(e1<5||e2<5||e3<5||e4<5)return{valid:false,stat:0,p:1};const s=((a-e1)**2)/e1+((b-e2)**2)/e2+((c-e3)**2)/e3+((d-e4)**2)/e4;return{valid:true,stat:s,p:1-erf(Math.sqrt(s/2))};}
function zTest(p1,n1,p2,n2){if(n1<30||n2<30)return{valid:false,z:0,p:1};const ph=(p1*n1+p2*n2)/(n1+n2);const se=Math.sqrt(ph*(1-ph)*(1/n1+1/n2));if(se===0)return{valid:true,z:0,p:1};const z=(p1-p2)/se;return{valid:true,z,p:2*(1-.5*(1+erf(Math.abs(z)/Math.sqrt(2))))};}
function fmtP(p){return p<.001?"< 0.001":p.toFixed(4);}
function pLabel(p){return p<=.01?"(highly significant)":p<=.05?"(significant)":p<=.10?"(marginal)":"(not significant)";}
function pBadge(p){return p<=.05?"badge-red":p<=.10?"badge-amber":"badge-green";}

function bestP(){const{a,b,c,d,n1,n2}=nums();const{rateA,rateB}=rates();if(n1===0||n2===0)return 1;const fp=fisherExact(a,b,c,d);const cr=chi2(a,b,c,d);const zr=zTest(rateA,n1,rateB,n2);return Math.min(fp,cr.valid?cr.p:1,zr.valid?zr.p:1);}
function ctxMax(){return Math.max(state.context.decisionType,state.context.affectedPop,state.context.scale,state.context.reversibility);}
function finalClass(){const q=classifyDI(calcDI());if(q==="None")return"None";const lvl=["None","Low","Moderate","Critical"];let i=lvl.indexOf(q);i=Math.min(i+ctxMax(),3);const bp=bestP();if(bp>.10)i=Math.max(i-1,0);else if(bp<=.01)i=Math.min(i+1,3);return lvl[i];}

function reviewRec(fc){
 if(fc==="Critical")return{days:30,interval:"After remediation, before return to service",
  text:"Re-test after remediation and before the system returns to service. Once cleared, test quarterly for at least two consecutive cycles before resuming the standard cadence."};
 if(fc==="Moderate")return{days:90,interval:"Within 90 days",
  text:"Re-test within 90 days to verify the remediation plan has closed the disparity. Then resume the system's scheduled cadence."};
 if(fc==="Low")return{days:180,interval:"Next scheduled cycle",
  text:"Re-test at the next scheduled cycle. If a Low finding persists across two consecutive cycles, escalate the finding to Moderate."};
 return{days:180,interval:"Standard cadence",
  text:"Continue your organization\u2019s standard testing schedule. A common baseline is quarterly for high-impact systems and semi-annually for elevated systems."};}
function nextDue(days){const base=state.testDate?new Date(state.testDate+"T00:00:00"):new Date();base.setDate(base.getDate()+days);return base.toLocaleDateString();}

function canProceed(){if(state.step===0)return state.sysName&&state.owner;if(state.step===1){const{n1,n2}=nums();return n1>0&&n2>0;}return true;}

function hasData(){const{n1,n2}=nums();return n1>0&&n2>0;}
function toggleAhead(){aheadOpen=!aheadOpen;renderAhead();}
function renderAhead(){const el=document.getElementById("ahead");if(!el)return;
let h=`<button class="ahead-toggle" onclick="toggleAhead()" aria-expanded="${aheadOpen}"><span>What\u2019s ahead: the seven steps and what each one needs</span><span>${aheadOpen?"\u2212":"+"}</span></button>`;
if(aheadOpen){h+=`<div class="ahead-body"><p class="ahead-lead">You can open any step from the bar above to look around. Only Group Data has to be filled in before the results mean anything.</p>`;
STEP_INFO.forEach((s,i)=>{h+=`<div class="ahead-item"><span class="ahead-n">${i+1}</span><div><div class="ahead-t">${s[0]}</div><div class="ahead-d">${s[1]}</div></div></div>`;});
h+=`</div>`;}
el.innerHTML=h;}

function renderSteps(){const bar=document.getElementById("steps-bar");let h="";STEPS.forEach((s,i)=>{const cls=i===state.step?"active":i<state.step?"done":"pending";h+=`<button class="step-btn ${cls}" onclick="goStep(${i})"><span class="step-num">${i<state.step?"\u2713":i+1}</span><span class="step-label">${s}</span></button>`;if(i<STEPS.length-1)h+=`<div class="step-sep ${i<state.step?"done":"pending"}"></div>`;});bar.innerHTML=h;}

function renderNav(){const nav=document.getElementById("nav-buttons");if(state.step>=6){nav.innerHTML="";return;}
nav.innerHTML=`<button class="btn btn-secondary" ${state.step===0?"disabled":""} onclick="goStep(${state.step-1})">Back</button><button class="btn btn-primary" ${canProceed()?"":"disabled"} onclick="goStep(${state.step+1})">${state.step===5?"Generate report":"Continue"}</button>`;}

function goStep(n){if(state.step<6)sync();state.step=n;render();}

function render(){renderSteps();renderAhead();renderNav();const el=document.getElementById("step-content");el.innerHTML="";
switch(state.step){
case 0:el.innerHTML=`<h2>System info</h2><p class="desc">Identify the AI system under test and the organization conducting the assessment.</p>
<div class="field"><label>Organization name</label><input type="text" id="f-agency" value="${esc(state.agencyName)}" placeholder="Your organization"></div>
<div class="field"><label>AI system name *</label><input type="text" id="f-sysname" value="${esc(state.sysName)}" placeholder="e.g., Benefits Eligibility Review Tool"></div>
<div class="field"><label>System ID or register ID</label><input type="text" id="f-regid" value="${esc(state.regId)}" placeholder="e.g., AI-2026-001"></div>
<div class="field"><label>AI system owner *</label><input type="text" id="f-owner" value="${esc(state.owner)}" placeholder="Name and title"></div>

document.querySelectorAll("#step-content input, #step-content select").forEach(e=>e.addEventListener("input",()=>{sync();renderNav();}));break;

case 1:{const{n1,n2}=nums();el.innerHTML=`<h2>Group data</h2><p class="desc">Enter the two groups you are comparing and the outcome counts. Groups should be defined by protected class (e.g., race, ethnicity, sex, age, disability status) per applicable civil rights requirements.</p>

<tr><td>${esc(state.groupBName)}</td><td><input type="number" min="0" id="f-bp" class="input-center" value="${state.groupBPos}" placeholder="0"></td><td><input type="number" min="0" id="f-bn" class="input-center" value="${state.groupBNeg}" placeholder="0"></td><td style="text-align:center;font-weight:500" id="total-b">${n2}</td></tr>
</tbody></table></div>
<div id="step1-hint">${(n1>0&&n2>0)?`<p class="hint">Total observations: ${n1+n2}. ${(n1<30||n2<30)?"Note: One or both groups have fewer than 30 observations. Fisher's Exact Test will be the primary test.":""}</p>`:""}</div>`;
document.querySelectorAll("#step-content input").forEach(e=>e.addEventListener("input",()=>{sync();const{n1,n2}=nums();const ta=document.getElementById("total-a");const tb=document.getElementById("total-b");if(ta)ta.textContent=n1;if(tb)tb.textContent=n2;const hint=document.getElementById("step1-hint");if(hint)hint.innerHTML=(n1>0&&n2>0)?`<p class="hint">Total observations: ${n1+n2}. ${(n1<30||n2<30)?"Note: One or both groups have fewer than 30 observations. Fisher's Exact Test will be the primary test.":""}</p>`:"";renderNav();}));break;}

case 2:{const hd=hasData();const di=calcDI();const q=hd?classifyDI(di):null;const s=hd?SEV[q]:NEUTRAL;const{rateA,rateB}=rates();const lo=Math.min(rateA,rateB),hi=Math.max(rateA,rateB);const loG=rateA<rateB?state.groupAName:state.groupBName;const hiG=rateA<rateB?state.groupBName:state.groupAName;
el.innerHTML=`<h2>Metrics</h2><p class="desc">Calculated from your contingency table. The Disparate Impact Ratio uses the four-fifths rule from the Uniform Guidelines on Employee Selection Procedures (29 CFR 1607.4).</p>

<div class="metric-box sev" style="border-color:${s.border};background:${s.bg}"><div class="metric-label" style="color:${s.text}">Disparate impact ratio</div><div class="metric-val" style="color:${s.text}">${hd?di.toFixed(3):"\u2014"}</div><div class="metric-sub" style="color:${s.text}">${hd?"Quantitative: "+q:"Awaiting group data"}</div></div></div>
<div class="info"><div class="info-title">Interpretation</div>${hd?`<p>${esc(loG)} has a selection rate of ${(lo*100).toFixed(1)}%, compared to ${esc(hiG)} at ${(hi*100).toFixed(1)}%. The ratio is ${di.toFixed(3)}, which is ${di>=.8?"at or above":"below"} the 0.80 threshold.</p>`:`<p>Selection rates and the disparate impact ratio appear here once you enter outcome counts on step 2, Group Data.</p>`}${hd&&di<.8?`<p style="font-weight:500;color:${s.text};margin-top:.5rem">This falls in the ${q} zone. Statistical significance testing on the next step will confirm whether this disparity is likely real or could be due to chance.</p>`:""}</div>
<div style="border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem"><div class="metric-label" style="margin-bottom:.5rem">Threshold reference</div><table class="thresh-table"><thead><tr><th style="text-align:left">Metric</th><th>Pass (&ge;0.90)</th><th>Low (0.80-0.89)</th><th>Moderate (0.65-0.79)</th><th>Critical (&lt;0.65)</th></tr></thead><tbody><tr><td>DI Ratio</td>${["None","Low","Moderate","Critical"].map(c=>`<td><span class="dot ${q===c?"active":"dim"}" style="background:${SEV[c].border};color:${SEV[c].border}"></span></td>`).join("")}</tr></tbody></table></div>`;break;}

case 3:{const hd=hasData();const{a,b,c,d,n1,n2}=nums();const{rateA,rateB}=rates();const fp=n1>0&&n2>0?fisherExact(a,b,c,d):1;const cr=n1>0&&n2>0?chi2(a,b,c,d):{valid:false,stat:0,p:1};const zr=n1>0&&n2>0?zTest(rateA,n1,rateB,n2):{valid:false,z:0,p:1};const bp=bestP();
const tests=[{name:"Fisher's Exact Test",note:"Valid for all sample sizes. Recommended default.",p:fp,valid:true,stat:null,sl:null},{name:"Chi-Square Test",note:cr.valid?"All expected cell counts are 5+. Valid.":"One or more expected cell counts below 5. Not valid for this data. Use Fisher's instead.",p:cr.p,valid:cr.valid,stat:cr.stat,sl:"\u03C7\u00B2"},{name:"Two-Proportion Z-Test",note:zr.valid?"Both groups have 30+ observations. Valid.":"One or both groups have fewer than 30 observations. Not valid for this data.",p:zr.p,valid:zr.valid,stat:zr.z,sl:"Z"}];

<div class="info"><div class="info-title">${hd?"Best available p-value: "+fmtP(bp):"Best available p-value: \u2014"}</div><p>${!hd?"Significance results appear here once you enter outcome counts on step 2, Group Data.":bp<=.01?"Highly significant. The disparity is very unlikely due to chance. Consider escalating by one severity level.":bp<=.05?"Significant. The disparity is unlikely due to chance. The quantitative finding stands as classified.":bp<=.10?"Marginal. The result is borderline. The finding may be reduced by one level. Schedule a follow-up test with a larger sample.":"Not significant. The observed disparity could reasonably be due to chance. The finding is reduced by one severity level."}</p></div>`;break;}

case 4:{const ctxDefs={decisionType:{label:"Decision type",opts:["Informational (Standard)","Influences human decision (Elevated, +1)","Directly determines outcomes (High, +2)"],scores:[0,1,2]},affectedPop:{label:"Affected population",opts:["Internal staff only (Standard)","General public (Elevated, +1)","Vulnerable populations (High, +2)"],scores:[0,1,2]},scale:{label:"Scale of impact",opts:["< 100 decisions/year (Standard)","100 - 10,000 decisions/year (Elevated, +1)","> 10,000 decisions/year (High, +2)"],scores:[0,1,2]},reversibility:{label:"Reversibility",opts:["Easily reversed (Standard)","Reversible with effort (Elevated, +1)","Difficult to reverse (High, +2)"],scores:[0,1,2]}};

<div class="info"><span style="font-weight:500">Highest context factor: </span>${cm===0?"Standard (no adjustment)":cm===1?"Elevated (+1 severity level)":"High (+2 severity levels)"}</div>`;break;}

case 5:{const hd=hasData();const fc=hd?finalClass():null;const s=hd?SEV[fc]:NEUTRAL;const di=calcDI();const q=hd?classifyDI(di):null;const bp=bestP();const cm=ctxMax();

<div class="info"><div class="info-title">Recommended response:</div>${!hd?"<p>The recommended response depends on the final classification, which appears once group data is entered.</p>":fc==="Critical"?"<p>Immediate suspension of AI system pending remediation. Governance body review required before reactivation. Leadership notification.</p>":fc==="Moderate"?"<p>Remediation plan due within 30 days. Add human review checkpoint for affected decisions. Notify governance body. System may continue with enhanced monitoring.</p>":fc==="Low"?"<p>Document finding and root cause analysis. Monitor at next scheduled test. No system interruption required. If Low persists across two consecutive test cycles, escalate to Moderate.</p>":"<p>Document results. Continue standard monitoring schedule.</p>"}</div>`;break;}

case 6:{const hd=hasData();
if(!hd){el.innerHTML=`<h2>Report</h2><p class="desc">The report is generated from your test data.</p><div class="preview-banner"><strong>No report yet \u2014 group data is required.</strong>A bias testing report cannot be produced without outcome counts. Enter your two groups and their favourable and unfavourable counts on step 2, Group Data, and the report will be generated here.</div><div class="btn-group"><button class="btn btn-primary" onclick="goStep(1)">Go to Group Data</button><button class="btn btn-secondary" onclick="goStep(0)">Start new test</button></div>`;break;}
const fc=finalClass();const s=SEV[fc];const di=calcDI();const q=classifyDI(di);const{a,b,c,d,n1,n2}=nums();const{rateA,rateB}=rates();const fp=n1>0&&n2>0?fisherExact(a,b,c,d):1;const cr=n1>0&&n2>0?chi2(a,b,c,d):{valid:false};const zr=n1>0&&n2>0?zTest(rateA,n1,rateB,n2):{valid:false};const cm=ctxMax();const bp=bestP();
el.innerHTML=`<h2>Report</h2><p class="desc">Review the summary below. Print or save this report with your AI system's governance records.</p>
<div class="report" id="report-content">

<div class="report-grid">${state.agencyName?`<span>Organization:</span><span class="val">${esc(state.agencyName)}</span>`:""}<span>AI System:</span><span class="val">${esc(state.sysName)}</span><span>System ID:</span><span class="val">${state.regId||"N/A"}</span><span>Owner:</span><span class="val">${esc(state.owner)}</span><span>Test Date:</span><span class="val">${state.testDate}</span><span>Test Type:</span><span class="val">${state.testType}</span></div>

<div class="report-section"><div class="report-metrics"><div><span>DI Ratio</span><span class="big">${di.toFixed(3)}</span></div><div><span>Quantitative</span><span style="font-weight:500">${q}</span></div><div><span>Context Adj.</span><span style="font-weight:500">${cm===0?"None":cm===1?"+1":"+2"}</span></div></div></div>
<div class="report-section"><div class="report-section-title">Statistical tests</div><div class="stats-grid"><div class="stat-box"><div class="stat-name">Fisher's Exact</div><div class="stat-val">p = ${fmtP(fp)}</div></div><div class="stat-box"><div class="stat-name">Chi-Square</div><div class="stat-val">${cr.valid?`\u03C7\u00B2 = ${cr.stat.toFixed(3)}, p = ${fmtP(cr.p)}`:"N/A"}</div></div><div class="stat-box"><div class="stat-name">Z-Test</div><div class="stat-val">${zr.valid?`Z = ${zr.z.toFixed(3)}, p = ${fmtP(zr.p)}`:"N/A"}</div></div></div></div>
<div class="report-section"><div class="report-final"><span class="report-final-label">Final Classification:</span><span class="report-final-badge" style="background:${s.bg};color:${s.text};border-color:${s.border}">${fc}</span></div></div>
<div class="report-section"><div class="report-section-title">Re-review frequency</div><div class="report-grid"><span>Recommended interval</span><span class="val">${reviewRec(fc).interval}</span><span>Target next test date</span><span class="val">${nextDue(reviewRec(fc).days)}</span></div><div style="margin-top:.4rem">${reviewRec(fc).text}</div></div>
<div class="report-section report-methodology"><div>Methodology: Disparate Impact Ratio per Uniform Guidelines on Employee Selection Procedures (29 CFR 1607.4). Statistical significance via Fisher's Exact Test, Chi-Square Test of Independence, and/or Two-Proportion Z-Test. Context assessment per NIST AI Risk Management Framework 1.0 (AI 100-1) Measure function.</div><div style="margin-top:4px">References: NIST AI RMF 1.0, NIST SP 1270, EEOC Technical Assistance on AI and Title VII (May 2023).</div></div>
</div>
<div class="btn-group"><button class="btn btn-dark" onclick="printReport()">Save as PDF</button><button class="btn btn-secondary" onclick="goStep(0)">Start new test</button></div><p class="hint" style="text-align:center">Your browser\u2019s print dialog will open. Choose <strong>Save as PDF</strong> as the destination, and keep background graphics enabled so the classification colour is retained.</p>`;break;}
}
if(state.step>=2&&!hasData()){el.insertAdjacentHTML("afterbegin",`<div class="preview-banner"><strong>Preview only \u2014 these are not your results.</strong>You are looking ahead before entering data. Every figure on this page is a placeholder produced from empty counts, including any classification shown. Go to step 2, Group Data, and enter your outcome counts to see real results.</div>`);}
}

function setCtx(k,v){state.context[k]=v;render();}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

function printReport(){
const content=document.getElementById("report-content").innerHTML;
const w=window.open("","_blank");
w.document.write(`<!DOCTYPE html><html><head><title>Bias Test Report - ${esc(state.sysName)}</title><style>*,*::before,*::after{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}@media print{@page{margin:14mm}}body{font-family:'DM Sans',system-ui,sans-serif;max-width:700px;margin:2rem auto;color:#1a1a1a;font-size:13px;line-height:1.6}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:6px 10px;text-align:left}.report-header{text-align:center;border-bottom:1px solid #e5e7eb;padding-bottom:1rem;margin-bottom:1rem}.report-title{font-size:1.125rem;font-weight:700}.report-org{font-size:.875rem;color:#4b5563}.report-date{font-size:.75rem;color:#9ca3af}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:1rem}.report-grid .val{font-weight:500}.report-section{border-top:1px solid #e5e7eb;padding-top:.75rem;margin-top:.75rem}.report-section-title{font-size:.75rem;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}.stat-box{background:#f9fafb;border-radius:.375rem;padding:.5rem;font-size:.75rem}.stat-name{font-weight:500}.stat-val{font-family:monospace}.report-final{display:flex;align-items:center;gap:.75rem}.report-final-label{font-size:.75rem;color:#6b7280}.report-final-badge{padding:.5rem 1rem;border-radius:.5rem;font-weight:700;font-size:1.125rem;border-width:2px;border-style:solid}.report-methodology{font-size:.75rem;color:#6b7280;line-height:1.5}.report-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}.report-metrics div span:first-child{display:block;font-size:.75rem;color:#6b7280}.big{font-family:monospace;font-weight:700;font-size:1.125rem}</style></head><body>${content}</body></html>`);
w.document.close();w.print();}

render();
</script>
