<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f9fafb;color:#111827;line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:680px;margin:0 auto;padding:2rem 1rem}
.text-center{text-align:center}
h1{font-size:1.5rem;font-weight:700;color:#111827}

.subtitle{font-size:.875rem;color:#6b7280;margin-top:.25rem}
.basis{font-size:.75rem;color:#9ca3af;margin-top:.125rem}

/* Steps indicator */
.steps{display:flex;align-items:center;justify-content:center;gap:4px;margin:2rem 0;flex-wrap:wrap}
.step-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9999px;font-size:.75rem;font-weight:500;border:none;cursor:default;transition:all .2s}
.step-btn.active{background:#2563eb;color:#fff}
.step-btn.done{background:#dbeafe;color:#1d4ed8;cursor:pointer}
.step-btn.done:hover{background:#bfdbfe}
.step-btn.pending{background:#f3f4f6;color:#9ca3af;cursor:pointer}
.step-btn.pending:hover{background:#e5e7eb;color:#4b5563}
.preview-banner{background:#fff8e1;border:1px solid #ffa000;border-left-width:4px;border-radius:.5rem;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.8125rem;color:#7c4a00;line-height:1.5}
.preview-banner strong{display:block;margin-bottom:2px}
.ahead{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;margin-bottom:1.5rem;overflow:hidden}
.ahead-toggle{width:100%;background:none;border:none;padding:.8rem 1.25rem;font-size:.8125rem;font-weight:600;color:#1d4ed8;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:inherit}
.ahead-toggle:hover{background:#f9fafb}
.ahead-body{padding:.25rem 1.25rem 1rem;border-top:1px solid #f3f4f6}
.ahead-lead{font-size:.8125rem;color:#4b5563;margin:.6rem 0 .5rem}
.ahead-item{display:flex;gap:.7rem;padding:.55rem 0;border-bottom:1px solid #f9fafb;font-size:.8125rem;text-align:left}
.ahead-item:last-child{border-bottom:none}
.ahead-n{flex:0 0 22px;height:22px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600}
.ahead-t{font-weight:600;color:#111827}
.ahead-d{color:#6b7280;margin-top:1px;line-height:1.45}
.step-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.step-btn.active .step-num{background:rgba(255,255,255,.2)}
.step-sep{width:16px;height:1px;margin:0 2px}
.step-sep.done{background:#93c5fd}
.step-sep.pending{background:#e5e7eb}

/* Card */
.card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}

/* Form elements */
label{display:block;font-size:.875rem;font-weight:500;color:#374151;margin-bottom:.25rem}
input[type="text"],input[type="number"],input[type="date"],select{width:100%;padding:.5rem .75rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.875rem;font-family:inherit;color:#111827;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.3)}
/* Hide number input spinner arrows */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
.input-center{text-align:center}
.field{margin-bottom:1rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.hint{font-size:.75rem;color:#6b7280;margin-top:.5rem}
.desc{font-size:.875rem;color:#4b5563;margin-bottom:1rem}

/* Table */
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{background:#f3f4f6;padding:.75rem 1rem;text-align:center;font-weight:500;color:#374151}
th:first-child{text-align:left}
td{padding:.75rem 1rem;border-top:1px solid #f3f4f6}
td:first-child{font-weight:500;color:#374151}
.tbl-wrap{border:1px solid #e5e7eb;border-radius:.75rem;overflow:hidden;margin-bottom:1rem}

/* Metric cards */

/* Info box */

/* Test result cards */
.test-card{border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem;margin-bottom:.75rem}
.test-card.disabled{border-color:#f3f4f6;opacity:.6}
.test-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem}
.test-name{font-weight:500;color:#1f2937}
.badge{padding:4px 12px;border-radius:9999px;font-size:.75rem;font-weight:500}

/* Context buttons */

.ctx-btn:hover{border-color:#9ca3af}

/* Classification */
.class-box{border-width:2px;border-style:solid;border-radius:1rem;padding:1.5rem;text-align:center;margin-bottom:1.25rem}
.class-label{font-size:.875rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em}

.breakdown{border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem;font-size:.875rem;margin-bottom:1.25rem}

.bk-row{display:flex;justify-content:space-between;margin-bottom:.25rem;color:#374151}
.bk-row span:last-child{font-weight:500}

/* Report */
.report{border:1px solid #e5e7eb;border-radius:.75rem;padding:1.25rem;font-size:.875rem;background:#fff;margin-bottom:1rem}
.report-header{text-align:center;border-bottom:1px solid #e5e7eb;padding-bottom:1rem;margin-bottom:1rem}
.report-title{font-size:1.125rem;font-weight:700;color:#111827}
.report-org{font-size:.875rem;color:#4b5563}
.report-date{font-size:.75rem;color:#9ca3af}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:1rem}
.report-grid span:first-child{color:#6b7280}
.report-grid .val{font-weight:500}
.report-section{border-top:1px solid #e5e7eb;padding-top:.75rem;margin-top:.75rem}
.report-section-title{font-size:.75rem;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.stat-box{background:#f9fafb;border-radius:.375rem;padding:.5rem;font-size:.75rem}
.stat-box .stat-name{font-weight:500}
.stat-box .stat-val{font-family:monospace}
.report-final{display:flex;align-items:center;gap:.75rem}
.report-final-label{font-size:.75rem;color:#6b7280}
.report-final-badge{padding:.5rem 1rem;border-radius:.5rem;font-weight:700;font-size:1.125rem;border-width:2px;border-style:solid}
.report-methodology{font-size:.75rem;color:#6b7280;line-height:1.5}
.report-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:.5rem}
.report-metrics div span:first-child{display:block;font-size:.75rem;color:#6b7280}
.report-metrics .big{font-family:monospace;font-weight:700;font-size:1.125rem}

/* Buttons */
.btn-row{display:flex;justify-content:space-between}
.btn{padding:.625rem 1.25rem;border-radius:.5rem;font-size:.875rem;font-weight:500;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-primary:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}
.btn-secondary{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-secondary:hover{background:#f9fafb}
.btn-secondary:disabled{color:#d1d5db;cursor:not-allowed;border-color:#e5e7eb}
.btn-dark{background:#1f2937;color:#fff}.btn-dark:hover{background:#374151}
.btn-group{display:flex;gap:.75rem}

/* Threshold dots */
.thresh-table{width:100%;font-size:.875rem;margin-top:.25rem}
.thresh-table th{font-size:.75rem;color:#6b7280;font-weight:400;padding:.25rem}
.thresh-table td{padding:.25rem;text-align:center}
.thresh-table td:first-child{text-align:left;color:#374151}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%}
.dot.active{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
.dot.dim{opacity:.3}

/* Footer */
.footer{margin-top:2rem;text-align:center;font-size:.75rem;color:#9ca3af;line-height:1.8}
.footer a{color:#3b82f6;text-decoration:underline}
.footer a:hover{color:#2563eb}

/* Print */
@media print{*,*::before,*::after{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}body{background:#fff}.container{max-width:100%}.steps,.btn-row,.btn-group,.footer,.ahead,.preview-banner{display:none!important}.card{box-shadow:none;border:1px solid #ccc}}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}.metric-row{grid-template-columns:1fr}.ctx-opts{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr}.report-grid{grid-template-columns:1fr}.report-metrics{grid-template-columns:1fr}}

/* --- multi-comparison additions --- */
.cmp-card{border:1px solid #e5e7eb;border-radius:.85rem;padding:1rem;margin-bottom:1rem;background:#fcfcfd}
.cmp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.cmp-n{font-size:.8rem;font-weight:600;color:#1d4ed8}
.cmp-remove{background:none;border:none;color:#9ca3af;font-size:.75rem;cursor:pointer;font-family:inherit;padding:2px 6px;border-radius:4px}
.cmp-remove:hover{color:#b91c1c;background:#fef2f2}
.data-table{width:100%;border-collapse:collapse;font-size:.8125rem;margin-top:.4rem}
.data-table th{background:#f3f4f6;padding:.5rem;font-weight:500;color:#374151;text-align:center;font-size:.75rem}
.data-table th:first-child{text-align:left}
.data-table td{padding:.4rem;border-top:1px solid #f3f4f6;text-align:center}
.data-table td.rowlab{text-align:left;font-weight:500;color:#374151}
.data-table input{width:100%;padding:.4rem;border:1px solid #d1d5db;border-radius:.4rem;text-align:center;font-family:inherit;font-size:.8125rem}
.th-sub{font-weight:400;color:#6b7280;font-size:.7rem}
.cmp-table{width:100%;border-collapse:collapse;font-size:.8125rem;margin:.5rem 0 1rem}
.cmp-table th{background:#f3f4f6;padding:.5rem .6rem;text-align:left;font-weight:500;color:#374151;font-size:.75rem;border-bottom:1px solid #e5e7eb}
.cmp-table td{padding:.5rem .6rem;border-bottom:1px solid #f3f4f6;vertical-align:top}
.cmp-table tr.dim td{color:#9ca3af;font-style:italic}
.cmp-badge{display:inline-block;padding:2px 9px;border-radius:9999px;font-size:.7rem;font-weight:600;border:1px solid}
.mono{font-family:'DM Sans',monospace}
.class-sub{font-size:.75rem;margin-top:.35rem;opacity:.85}
.stats-inline{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.stat-chip{background:#f3f4f6;border-radius:.4rem;padding:2px 8px;font-size:.7rem;color:#374151;font-family:monospace}
.stat-chip.dim{opacity:.5}
.ctx-btn{padding:.7rem;border-radius:.5rem;font-size:.72rem;text-align:left;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;font-family:inherit;transition:all .15s}
.ctx-btn:hover{border-color:#9ca3af}
.ctx-btn.sel{border-color:#2563eb;background:#eff6ff;color:#1e40af;box-shadow:0 0 0 1px #93c5fd}
@media(max-width:640px){.cmp-table{font-size:.75rem}.cmp-table th,.cmp-table td{padding:.35rem}}
</style>

<body>
<div class="container" id="app">
  <div class="text-center" style="margin-bottom:2rem">
    <h1>AI Bias Testing Tool</h1>
    <div class="subtitle">Disparate impact analysis for AI systems</div>
    <div class="basis">Based on NIST AI RMF 1.0, EEOC Uniform Guidelines (29 CFR 1607.4), and NIST SP 1270</div>
  </div>
  <div class="steps" id="steps-bar"></div>
  <div class="ahead" id="ahead"></div>
  <div class="card" id="step-content"></div>
  <div class="btn-row" id="nav-buttons"></div>
  <div class="footer">
     <p>Methodology: NIST AI RMF 1.0, NIST SP 1270, EEOC Uniform Guidelines (29 CFR 1607.4), EEOC Technical Assistance on AI and Title VII.</p>
  </div>
</div>

<script>
const STEPS=["System Info","Comparisons","Metrics","Statistics","Context","Classification","Report"];
const STEP_INFO=[
 ["System Info","The system name, owner, register ID, test date, and whether this is pre-deployment, recurring, or incident-triggered."],
 ["Comparisons","Each pair of groups you are comparing, defined by protected class, with the favourable and unfavourable outcome counts for each. Add as many comparisons as the use case needs. Gather these before you start."],
 ["Metrics","Calculated for you. Selection rates and the disparate impact ratio for every comparison, against the four-fifths rule."],
 ["Statistics","Calculated for you. Fisher's Exact, chi-square, and two-proportion z-test run on each comparison, plus a multiplicity-adjusted p-value shown for context."],
 ["Context","Four questions about the decision: its type, who it affects, how many decisions per year, and how reversible it is. Answered once for the system."],
 ["Classification","A classification for each comparison and an overall result for the system, plus a plain-language summary."],
 ["Report","A single printable record covering every comparison, for your AI inventory and governance review."]];
let aheadOpen=false;

const SEV={None:{bg:"#e8f5e9",text:"#1b5e20",border:"#4caf50"},Low:{bg:"#fff8e1",text:"#e65100",border:"#ffa000"},Moderate:{bg:"#fff3e0",text:"#bf360c",border:"#e65100"},Critical:{bg:"#ffebee",text:"#b71c1c",border:"#c62828"}};
const NEUTRAL={bg:"#f9fafb",text:"#6b7280",border:"#d1d5db"};
const LEVELS=["None","Low","Moderate","Critical"];

function newComparison(){return{label:"",aName:"Group A",bName:"Group B",aPos:"",aNeg:"",bPos:"",bNeg:""};}

let state={step:0,agencyName:"",sysName:"",regId:"",owner:"",
 testDate:new Date().toISOString().slice(0,10),testType:"Pre-Deployment",
 comparisons:[newComparison()],
 context:{decisionType:0,affectedPop:0,scale:0,reversibility:0}};

/* ---------- statistics ---------- */
function logFactorial(n){let r=0;for(let i=2;i<=n;i++)r+=Math.log(i);return r;}
function fisherExact(a,b,c,d){const n=a+b+c+d;const logDenom=logFactorial(a+b)+logFactorial(c+d)+logFactorial(a+c)+logFactorial(b+d)-logFactorial(n);const pCut=logDenom-(logFactorial(a)+logFactorial(b)+logFactorial(c)+logFactorial(d));let p=0;const maxI=Math.min(a+b,a+c);for(let i=0;i<=maxI;i++){const j=a+b-i,k=a+c-i,l=c+d-k;if(j<0||k<0||l<0)continue;const lp=logDenom-(logFactorial(i)+logFactorial(j)+logFactorial(k)+logFactorial(l));if(lp<=pCut+1e-10)p+=Math.exp(lp);}return Math.min(p,1);}
function chi2(a,b,c,d){const n=a+b+c+d;if(n===0)return{valid:false,stat:0,p:1};const e1=(a+b)*(a+c)/n,e2=(a+b)*(b+d)/n,e3=(c+d)*(a+c)/n,e4=(c+d)*(b+d)/n;if(e1<5||e2<5||e3<5||e4<5)return{valid:false,stat:0,p:1};const s=Math.pow(a-e1,2)/e1+Math.pow(b-e2,2)/e2+Math.pow(c-e3,2)/e3+Math.pow(d-e4,2)/e4;return{valid:true,stat:s,p:1-chi2CDF(s)};}
function chi2CDF(x){if(x<=0)return 0;return erf(Math.sqrt(x/2));}
function erf(x){const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;const sign=x<0?-1:1;x=Math.abs(x);const t=1/(1+p*x);const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);return sign*y;}
function zTest(p1,n1,p2,n2){if(n1<30||n2<30)return{valid:false,z:0,p:1};const ph=(p1*n1+p2*n2)/(n1+n2);const se=Math.sqrt(ph*(1-ph)*(1/n1+1/n2));if(se===0)return{valid:false,z:0,p:1};const z=(p1-p2)/se;return{valid:true,z:z,p:2*(1-normalCDF(Math.abs(z)))};}
function normalCDF(x){return .5*(1+erf(x/Math.sqrt(2)));}
function classifyDI(r){if(r>=.9)return"None";if(r>=.8)return"Low";if(r>=.65)return"Moderate";return"Critical";}
function fmtP(p){return p<.001?"< 0.001":p.toFixed(4);}
function pLabel(p){return p<=.01?"(highly significant)":p<=.05?"(significant)":p<=.10?"(marginal)":"(not significant)";}
function pBadge(p){return p<=.05?"badge-red":p<=.10?"badge-amber":"badge-green";}
function pct(x){return (x*100).toFixed(1)+"%";}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}

/* Holm-Bonferroni step-down adjustment. Advisory only: the raw p-value
   continues to drive the finding. */
function holmAdjust(ps){
 const m=ps.length;
 if(m===0)return[];
 const order=ps.map((p,i)=>({p:p,i:i})).sort((x,y)=>x.p-y.p);
 const out=new Array(m);
 let running=0;
 order.forEach((o,k)=>{const v=Math.min(1,(m-k)*o.p);running=Math.max(running,v);out[o.i]=running;});
 return out;
}

/* ---------- per-comparison computation ---------- */
function compStats(c){
 const a=parseInt(c.aPos)||0,b=parseInt(c.aNeg)||0,cc=parseInt(c.bPos)||0,d=parseInt(c.bNeg)||0;
 const n1=a+b,n2=cc+d;
 const ready=n1>0&&n2>0;
 const rateA=n1>0?a/n1:0,rateB=n2>0?cc/n2:0;
 const di=rateB>0?(rateA<rateB?rateA/rateB:rateB/rateA):0;
 const fp=ready?fisherExact(a,b,cc,d):1;
 const cr=ready?chi2(a,b,cc,d):{valid:false,stat:0,p:1};
 const zr=ready?zTest(rateA,n1,rateB,n2):{valid:false,z:0,p:1};
 const bestP=Math.min(fp,cr.valid?cr.p:1,zr.valid?zr.p:1);
 return{a:a,b:b,c:cc,d:d,n1:n1,n2:n2,ready:ready,rateA:rateA,rateB:rateB,di:di,
  fp:fp,cr:cr,zr:zr,bestP:bestP,q:ready?classifyDI(di):null,
  lowG:rateA<rateB?c.aName:c.bName,hiG:rateA<rateB?c.bName:c.aName,
  lowR:Math.min(rateA,rateB),hiR:Math.max(rateA,rateB),
  small:ready&&(n1<30||n2<30),
  name:(c.label&&c.label.trim())?c.label.trim():(c.aName+" vs "+c.bName)};
}
function allStats(){return state.comparisons.map(compStats);}
function readyStats(){return allStats().filter(s=>s.ready);}
function hasData(){return readyStats().length>0;}
function ctxMax(){return Math.max(state.context.decisionType,state.context.affectedPop,state.context.scale,state.context.reversibility);}

function adjustedPs(){
 const st=allStats();
 const idx=[];const ps=[];
 st.forEach((s,i)=>{if(s.ready){idx.push(i);ps.push(s.bestP);}});
 const adj=holmAdjust(ps);
 const out=new Array(st.length).fill(null);
 idx.forEach((i,k)=>{out[i]=adj[k];});
 return out;
}

function finalClassFor(s){
 if(!s.ready)return null;
 if(s.q==="None")return"None";
 let i=LEVELS.indexOf(s.q);
 i=Math.min(i+ctxMax(),3);
 if(s.bestP>.10)i=Math.max(i-1,0);
 else if(s.bestP<=.01)i=Math.min(i+1,3);
 return LEVELS[i];
}
function overallClass(){
 let best=-1;
 allStats().forEach(s=>{const f=finalClassFor(s);if(f)best=Math.max(best,LEVELS.indexOf(f));});
 return best<0?null:LEVELS[best];
}
function drivingStat(){
 let out=null,outIdx=-1,bestIdx=-1,bestDi=2;
 allStats().forEach((s,i)=>{
  if(!s.ready)return;
  const li=LEVELS.indexOf(finalClassFor(s));
  if(li>bestIdx||(li===bestIdx&&s.di<bestDi)){bestIdx=li;bestDi=s.di;out=s;outIdx=i;}
 });
 if(out)out.index=outIdx;
 return out;
}

/* ---------- re-review ---------- */
function reviewRec(fc){
 if(fc==="Critical")return{days:30,interval:"After remediation, before return to service",
  text:"Re-test after remediation and before the system returns to service. Once cleared, test quarterly for at least two consecutive cycles before resuming the standard cadence."};
 if(fc==="Moderate")return{days:90,interval:"Within 90 days",
  text:"Re-test within 90 days to verify the remediation plan has closed the disparity. Then resume the system's scheduled cadence."};
 if(fc==="Low")return{days:180,interval:"Next scheduled cycle",
  text:"Re-test at the next scheduled cycle. If a Low finding persists across two consecutive cycles, escalate the finding to Moderate."};
 return{days:180,interval:"Standard cadence",
  text:"Continue your organization\u2019s standard testing schedule. A common baseline is quarterly for high-impact systems and semi-annually for elevated systems."};
}
function nextDue(days){const b=state.testDate?new Date(state.testDate+"T00:00:00"):new Date();b.setDate(b.getDate()+days);return b.toLocaleDateString();}

/* ---------- narrative ---------- */
function listJoin(items){
 if(items.length===0)return"";
 if(items.length===1)return items[0];
 if(items.length===2)return items[0]+" and "+items[1];
 return items.slice(0,-1).join(", ")+", and "+items[items.length-1];
}
function buildNarrative(){
 const st=readyStats();
 if(st.length===0)return[];
 const adj=adjustedPs();
 const paras=[];
 const system=state.sysName||"the system under test";
 const m=st.length;
 const fcAll=overallClass();

 paras.push("This "+state.testType.toLowerCase()+" bias test examined "+system+" across "+
  (m===1?"one comparison":m+" comparisons")+": "+listJoin(st.map(s=>s.name))+".");

 const drv=drivingStat();
 const per100=Math.round(drv.di*100);
 let gap=(m===1?"":"The comparison driving the result is "+drv.name+". ")+
  drv.lowG+" received favourable outcomes at "+pct(drv.lowR)+" against "+pct(drv.hiR)+" for "+drv.hiG+
  ". The disparate impact ratio is "+drv.di.toFixed(3)+", which means that for every 100 "+drv.hiG+
  " receiving a favourable outcome at their group's rate, roughly "+per100+" "+drv.lowG+" did. ";
 if(drv.di>=.9)gap+="That sits above 0.90 and shows no meaningful separation between the two groups under the four-fifths rule.";
 else if(drv.di>=.8)gap+="That clears the 0.80 four-fifths threshold, though the margin is narrow enough to watch across future cycles.";
 else gap+="That falls below the 0.80 threshold set by the four-fifths rule, placing the quantitative finding in the "+drv.q+" range and marking the disparity as one requiring explanation.";
 paras.push(gap);

 if(m>1){
  const flagged=st.filter(s=>s.di<.8);
  const clear=st.filter(s=>s.di>=.8);
  let other="Across all "+m+" comparisons, "+
   (flagged.length===0?"none fell below the 0.80 threshold":
    flagged.length===m?"every one fell below the 0.80 threshold":
    flagged.length+" fell below the 0.80 threshold ("+listJoin(flagged.map(s=>s.name))+") and "+clear.length+" cleared it")+". ";
  const smalls=st.filter(s=>s.small);
  if(smalls.length>0)other+=listJoin(smalls.map(s=>s.name))+(smalls.length===1?" has":" have")+" a group under 30 observations, so "+(smalls.length===1?"that result carries":"those results carry")+" limited statistical power. ";
  other+="The overall classification takes the most severe result across comparisons, since a disparity affecting one group is not offset by parity in another.";
  paras.push(other);
 }

 let sig;
 if(drv.bestP<=.01)sig="Statistical testing puts the probability of a gap this size arising by chance at "+fmtP(drv.bestP)+". That is a highly significant result, so the disparity should be treated as real rather than as noise, and it raises the finding by one level.";
 else if(drv.bestP<=.05)sig="Statistical testing puts the probability of a gap this size arising by chance at "+fmtP(drv.bestP)+", significant at the conventional 0.05 threshold. The quantitative finding stands as measured.";
 else if(drv.bestP<=.10)sig="Statistical testing returns "+fmtP(drv.bestP)+", a marginal result. The gap may be real, but this sample cannot establish it confidently, so the finding is treated cautiously and a follow-up test with more data is warranted.";
 else sig="Statistical testing returns "+fmtP(drv.bestP)+", which is not significant. A gap this size could reasonably occur by chance at these sample sizes, so the finding is reduced by one level.";
 if(drv.small)sig+=" One or both groups in this comparison have fewer than 30 observations, so Fisher's Exact Test carried the result and the test has limited power.";
 paras.push(sig);

 if(m>1){
  const a=adj[drv.index];
  const sigRaw=st.filter(s=>s.bestP<=.05).length;
  let mult="Running "+m+" comparisons raises the chance that at least one crosses the 0.05 threshold by chance alone. "+
   "A Holm-Bonferroni adjustment is reported alongside each raw p-value for that reason. "+
   (a!=null?("For the driving comparison the raw p-value of "+fmtP(drv.bestP)+" adjusts to "+fmtP(a)+". "):"")+
   sigRaw+" of "+m+" comparisons "+(sigRaw===1?"is":"are")+" significant on the raw p-value. "+
   "The adjustment is advisory and does not change the classification, which continues to follow the raw p-value under your organization\u2019s classification policy. It is shown so the Council can weigh how many tests were run when reading the result.";
  paras.push(mult);
 }

 const drivers=[];
 if(state.context.decisionType===2)drivers.push("it directly determines outcomes rather than informing them");
 else if(state.context.decisionType===1)drivers.push("it influences a human decision");
 if(state.context.affectedPop===2)drivers.push("it affects vulnerable populations");
 else if(state.context.affectedPop===1)drivers.push("it affects the general public");
 if(state.context.scale===2)drivers.push("it operates above 10,000 decisions a year");
 else if(state.context.scale===1)drivers.push("it operates at 100 to 10,000 decisions a year");
 if(state.context.reversibility===2)drivers.push("its outcomes are difficult to reverse");
 else if(state.context.reversibility===1)drivers.push("its outcomes are reversible only with effort");
 if(ctxMax()===0)paras.push("The context assessment placed the system in the standard band on every factor, so no severity adjustment was applied.");
 else paras.push("The context assessment raised the severity by "+(ctxMax()===1?"one level":"two levels")+" because "+listJoin(drivers)+". The same numerical gap carries more weight in a setting like this than it would in a low-stakes one. Context is a property of the system, so the same adjustment applies to every comparison.");

 const rec=reviewRec(fcAll);
 let concl;
 if(fcAll==="Critical")concl="Taken together, the overall finding is Critical. A disparity of this size in a setting of this consequence warrants suspending the system pending remediation, with governance review before it returns to service and notification to leadership. "+rec.text;
 else if(fcAll==="Moderate")concl="Taken together, the overall finding is Moderate. The system can continue operating with enhanced monitoring, but a remediation plan is due within 30 days and a human review checkpoint should be added for affected decisions. "+rec.text;
 else if(fcAll==="Low")concl="Taken together, the overall finding is Low. No interruption to the system is required, but the finding and its root cause should be documented and carried into the next review. "+rec.text;
 else concl="Taken together, the overall finding is None. No disparity requiring action was identified in "+(m===1?"this comparison":"any of these comparisons")+". Document the result and continue monitoring. "+rec.text;
 concl+=" The target date for the next test is "+nextDue(rec.days)+".";
 paras.push(concl);

 paras.push("This summary is generated from the figures above. It is a screening result rather than a legal conclusion, and the four-fifths rule is a threshold for further inquiry rather than a definitive standard. Involve counsel before acting on a finding.");
 return paras;
}

/* ---------- comparison editing ---------- */
function addComparison(){sync();state.comparisons.push(newComparison());render();}
function removeComparison(i){sync();if(state.comparisons.length>1)state.comparisons.splice(i,1);render();}
function setCtx(k,v){state.context[k]=v;render();}

function sync(){
 const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
 if(state.step===0){
  const m={"f-agency":"agencyName","f-sysname":"sysName","f-regid":"regId","f-owner":"owner","f-date":"testDate","f-type":"testType"};
  Object.keys(m).forEach(k=>{const v=g(k);if(v!==null)state[k==="f-type"?"testType":m[k]]=v;});
 }
 if(state.step===1){
  state.comparisons.forEach((c,i)=>{
   [["label","label"],["aName","aName"],["bName","bName"],["aPos","aPos"],["aNeg","aNeg"],["bPos","bPos"],["bNeg","bNeg"]].forEach(pair=>{
    const v=g("c"+i+"-"+pair[0]);
    if(v!==null)c[pair[1]]=v;
   });
  });
 }
}

function canProceed(){
 if(state.step===0)return !!(state.sysName&&state.owner);

}

function comparisonTable(showAdj){

 });

<tr><td class="rowlab">${esc(c.bName)}</td><td><input type="number" min="0" id="c${i}-bPos" value="${esc(c.bPos)}" placeholder="0"></td><td><input type="number" min="0" id="c${i}-bNeg" value="${esc(c.bNeg)}" placeholder="0"></td><td class="mono" id="c${i}-t2">${s.n2}</td></tr>
</tbody></table><p class="hint" id="c${i}-hint">${s.ready?("Total observations: "+(s.n1+s.n2)+"."+(s.small?" One or both groups have fewer than 30 observations, so Fisher's Exact Test will carry this comparison.":"")):""}</p></div>`;

   h+=`<div style="border:1px solid #e5e7eb;border-radius:.75rem;padding:1rem"><div class="metric-label" style="margin-bottom:.5rem">Threshold reference</div><table class="thresh-table"><thead><tr><th style="text-align:left">Metric</th><th>Pass (&ge;0.90)</th><th>Low (0.80-0.89)</th><th>Moderate (0.65-0.79)</th><th>Critical (&lt;0.65)</th></tr></thead><tbody><tr><td>DI Ratio</td>${["None","Low","Moderate","Critical"].map(cl=>`<td><span class="dot ${drv.q===cl?"active":"dim"}" style="background:${SEV[cl].border};color:${SEV[cl].border}"></span></td>`).join("")}</tr></tbody></table></div>`;

<div class="test-note">Holm-adjusted p = ${adj[i]!=null?fmtP(adj[i]):"\u2014"}${s.small?". One or both groups are under 30 observations, so Fisher's Exact carries this comparison and power is limited.":"."}</div></div>`;

 case 4:{

 case 5:{

  el.innerHTML=h;break;}

 case 6:{
  if(!hasData()){
   el.innerHTML=`<h2>Report</h2><p class="desc">The report is generated from your test data.</p><div class="preview-banner"><strong>No report yet \u2014 comparison data is required.</strong>A bias testing report cannot be produced without outcome counts. Enter at least one comparison on step 2, Comparisons, and the report will be generated here.</div><div class="btn-group"><button class="btn btn-primary" onclick="goStep(1)">Go to Comparisons</button><button class="btn btn-secondary" onclick="goStep(0)">Start new test</button></div>`;
   break;
  }
  const fcAll=overallClass();const s=SEV[fcAll];const rec=reviewRec(fcAll);const st=allStats();const adj=adjustedPs();const m=readyStats().length;
  let h=`<h2>Report</h2><p class="desc">Review the summary below, then save it with your AI system's governance records.</p>
<div class="report" id="report-content">
<div class="report-header"><div class="report-title">AI Bias Testing Report</div>${state.agencyName?`<div class="report-org">${esc(state.agencyName)}</div>`:""}<div class="report-date">Generated ${new Date().toLocaleDateString()}</div></div>
<div class="report-grid"><span>AI System</span><span class="val">${esc(state.sysName)}</span><span>System ID</span><span class="val">${esc(state.regId)||"N/A"}</span><span>Owner</span><span class="val">${esc(state.owner)}</span><span>Test Date</span><span class="val">${state.testDate}</span><span>Test Type</span><span class="val">${esc(state.testType)}</span><span>Comparisons tested</span><span class="val">${m}</span></div>
<div class="report-section"><div class="report-section-title">Comparisons</div>${comparisonTable(true)}</div>
<div class="report-section"><div class="report-section-title">Contingency tables</div><table class="cmp-table"><thead><tr><th>Comparison</th><th>Group</th><th>Positive</th><th>Negative</th><th>Total</th><th>Rate</th></tr></thead><tbody>`;
  st.forEach(cs=>{
   if(!cs.ready)return;
   const c=state.comparisons[st.indexOf(cs)];
   h+=`<tr><td rowspan="2">${esc(cs.name)}</td><td>${esc(c.aName)}</td><td class="mono">${cs.a}</td><td class="mono">${cs.b}</td><td class="mono">${cs.n1}</td><td class="mono">${pct(cs.rateA)}</td></tr>`;
   h+=`<tr><td>${esc(c.bName)}</td><td class="mono">${cs.c}</td><td class="mono">${cs.d}</td><td class="mono">${cs.n2}</td><td class="mono">${pct(cs.rateB)}</td></tr>`;
  });
  h+=`</tbody></table></div>
<div class="report-section"><div class="report-section-title">Context assessment</div><div class="report-grid"><span>Decision type</span><span class="val">${["Informational","Influences human decision","Directly determines outcomes"][state.context.decisionType]}</span><span>Affected population</span><span class="val">${["Internal staff only","General public","Vulnerable populations"][state.context.affectedPop]}</span><span>Scale of impact</span><span class="val">${["< 100/year","100 - 10,000/year","> 10,000/year"][state.context.scale]}</span><span>Reversibility</span><span class="val">${["Easily reversed","Reversible with effort","Difficult to reverse"][state.context.reversibility]}</span><span>Severity adjustment</span><span class="val">${ctxMax()===0?"None":"+"+ctxMax()+" level"+(ctxMax()>1?"s":"")}</span></div></div>
<div class="report-section"><div class="report-final"><span class="report-final-label">Overall Classification:</span><span class="report-final-badge" style="background:${s.bg};color:${s.text};border-color:${s.border}">${fcAll}</span>${m>1?`<span class="report-final-label">most severe of ${m} comparisons</span>`:""}</div></div>
<div class="report-section"><div class="report-section-title">Summary</div>${buildNarrative().map(p=>`<p style="margin-bottom:6px">${esc(p)}</p>`).join("")}</div>
<div class="report-section"><div class="report-section-title">Re-review frequency</div><div class="report-grid"><span>Recommended interval</span><span class="val">${rec.interval}</span><span>Target next test date</span><span class="val">${nextDue(rec.days)}</span></div><div style="margin-top:.4rem">${rec.text}</div></div>
<div class="report-section report-methodology"><div>Methodology: Disparate Impact Ratio per Uniform Guidelines on Employee Selection Procedures (29 CFR 1607.4). Statistical significance via Fisher's Exact Test, Chi-Square Test of Independence, and Two-Proportion Z-Test, with the strongest applicable result used. Holm-Bonferroni adjustment reported for multiple comparisons and advisory only. Context assessment per NIST AI Risk Management Framework 1.0 (AI 100-1) Measure function.</div><div style="margin-top:4px">References: NIST AI RMF 1.0, NIST SP 1270, EEOC Technical Assistance on AI and Title VII (May 2023).</div></div>
</div>
<div class="btn-group"><button class="btn btn-dark" onclick="printReport()">Save as PDF</button><button class="btn btn-secondary" onclick="goStep(0)">Start new test</button></div>
<p class="hint" style="text-align:center">Your browser\u2019s print dialog will open. Choose <strong>Save as PDF</strong> as the destination, and keep background graphics enabled so the classification colour is retained.</p>`;
  el.innerHTML=h;break;}
 }
}

 w.document.close();w.print();
}

render();

</script>
